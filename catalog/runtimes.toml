# Catálogo fijado de runtimes (ADR 0002). Cambiar URL o hash es un commit revisado.
# Los SHA-256 de Windows x64 se contrastaron el 2026-10-21 contra el publicador:
# - Apache: .txt SHA-256 de Apache Lounge + archivo descargado
# - PHP: releases.json de windows.php.net + archivo descargado
# - MariaDB: sha256sums.txt de archive.mariadb.org + archivo descargado

[[runtime]]
component = "apache"
version = "2.4.66"
os = "windows"
arch = "x86_64"
urls = [
  "https://www.apachelounge.com/download/VS17/binaries/httpd-2.4.66-251206-win64-VS17.zip",
]
filename = "httpd-2.4.66-251206-win64-VS17.zip"
sha256 = "2cd1f349b6705e43e784e876a233eeb1a859fa6b8abc693a91f87b35a368f7f9"
license = "Apache-2.0"
notes = "ZIP Win64 de Apache Lounge (VS17), no binario de la ASF. Visual C++ 2015-2022 redistribuible en la carpeta del runtime si el ZIP no trae las DLL."

